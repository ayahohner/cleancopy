# Verbs and phrases whose literal sense restricts the subject.
#
# needs = "animate"       : a person, an organization, or an AI agent or model
# needs = "concrete"      : a physical object, a display, a mechanism (software
#                           that performs operations), or an agent
# needs = "speaker"       : an agent, a display, or a text that carries words,
#                           such as a message or a rule ("the rules say")
# needs = "evidential"    : a speaker or evidence ("the study shows that")
# needs = "propositional" : an agent, a text, an idea, or evidence ("the
#                           principle assumes")
# needs = "normative"     : an agent, a text, or an institution ("custom
#                           dictates")
# needs = [...]           : a list of classes and sets, such as
#                           ["concrete", "text", "idea"]
# severity = "info"  : a figure that reads as near-literal; worth fixing, not failing
#
# Suggestions name literal verbs for inanimate subjects.

[verb.decide]
suggest = ["determine", "select by rule"]
[verb.choose]
suggest = ["select", "determine"]
[verb.want]
suggest = ["require", "need"]
[verb.wish]
suggest = ["require"]
[verb.prefer]
suggest = ["rank first", "select"]
[verb.tolerate]
suggest = ["allow", "remain correct under"]
[verb.know]
suggest = ["contain", "store", "include"]
[verb.believe]
suggest = ["assume"]
[verb.think]
suggest = ["compute"]
[verb.hope]
[verb.expect]
suggest = ["assume", "require"]
[verb.intend]
[verb.try]
suggest = ["attempt (for a process)", "run"]
[verb.care]
[verb.worry]
[verb.understand]
suggest = ["interpret", "parse"]
[verb.remember]
suggest = ["store", "retain"]
[verb.forget]
suggest = ["discard", "drop"]
[verb.notice]
suggest = ["detect"]
[verb.realize]
[verb.insist]
needs = "speaker"
suggest = ["require"]
[verb.demand]
needs = "speaker"
suggest = ["require"]
[verb.ask]
needs = "speaker"
suggest = ["request", "require", "open a choice"]
[verb.answer]
needs = "speaker"
suggest = ["supply a value for", "address", "respond to (for a protocol)"]
[verb.tell]
needs = "speaker"
suggest = ["show", "indicate"]
[verb.say]
needs = "speaker"
suggest = ["state", "specify"]
[verb.claim]
needs = "speaker"
suggest = ["state"]
[verb.argue]
needs = "speaker"
suggest = ["imply", "show"]
[verb.pay]
suggest = ["use", "require", "cost"]
[verb.buy]
suggest = ["make possible", "provide"]
[verb.sell]
[verb.spend]
suggest = ["use", "take"]
[verb.earn]
suggest = ["obtain", "receive"]
[verb.afford]
suggest = ["allow"]
[verb.owe]
[verb.sit]
needs = "concrete"
suggest = ["lie", "be placed", "be"]
[verb.stand]
needs = "concrete"
[verb.walk]
needs = "concrete"
# Motion and display: a window moves and a chart shows a total, but discourse
# does not move and a theorem does not show.
[verb.move]
needs = "concrete"
suggest = ["change", "turn to (for a topic)", "is moved (passive)"]
[verb.show]
needs = ["concrete", "evidential"]
suggest = ["contain", "indicate", "is visible in"]
# Perception needs a perceiver.
[verb.see]
suggest = ["detect", "read"]
[verb.watch]
suggest = ["monitor", "subscribe to"]
[verb.hear]
suggest = ["receive"]
[verb.listen]
suggest = ["receive", "wait for"]
[verb.fight]
suggest = ["conflict with"]
[verb.compete]
[verb.win]
suggest = ["take precedence", "be selected"]
[verb.struggle]
[verb.suffer]
suggest = ["is degraded by"]
[verb.enjoy]
[verb.embrace]
suggest = ["include", "adopt"]
[verb.dictate]
needs = "normative"
suggest = ["determine"]
# Evidence demonstrates; an abstraction does not. A thing or a mechanism can
# too: "the gauge indicates that the tank is full", "the server confirms the
# move", "a module suggests alternatives".
[verb.demonstrate]
needs = ["concrete", "evidential"]
severity = "info"
suggest = ["is evidence that", "implies"]
[verb.establish]
needs = ["concrete", "evidential"]
severity = "info"
suggest = ["is evidence that", "implies"]
[verb.indicate]
needs = ["concrete", "evidential"]
severity = "info"
suggest = ["implies", "is a sign that"]
[verb.confirm]
needs = ["concrete", "evidential"]
severity = "info"
suggest = ["is evidence that", "is consistent with"]
[verb.reveal]
needs = ["concrete", "evidential"]
severity = "info"
suggest = ["makes visible", "exposes (for a test)"]
[verb.suggest]
needs = ["concrete", "evidential"]
severity = "info"
suggest = ["is evidence that", "implies"]

# Figures built from a verb and a particle, preposition, object, or naming
# complement. The single verb has literal senses with any subject.
[[phrase]]
verb = "draw"
object = "line"
suggest = ["separate", "state the boundary between"]

[[phrase]]
verb = "pay"
prep = "for"
suggest = ["use", "require"]

[[phrase]]
verb = "give"
particle = "up"
suggest = ["exclude", "omit"]

[[phrase]]
verb = "take"
object = "part"
suggest = ["is involved", "participates (for agents)"]

[[phrase]]
verb = "call"
complement = true
suggest = ["defines as", "is called (passive)", "is named (passive)"]

[[phrase]]
verb = "keep"
object = "track"
suggest = ["record", "store"]

[[phrase]]
verb = "look"
prep = "at"
suggest = ["read", "inspect (for a tool)"]

[[phrase]]
verb = "reach"
prep = "for"
suggest = ["extends to", "takes on"]


# Left out on purpose: verbs with a literal sense for any subject in technical
# prose, such as "the function returns a value":
#   admit, accept, reject, use, run, read, write, send, receive, store,
#   hold, contain, carry, follow, lead, require, need, give, take, get,
#   make, keep, put, place, find, start, stop, open, close, check, test, record,
#   count, produce, replace, build, compute, evaluate, apply, return, pick,
#   present, seal, bind, merge, translate, list, mark, state, label, derive,
#   describe, define, express, include, cover, map, share, split, add, remove,
#   change, convert, allow, let, prevent, survive, fail, lose, wait, respond,
#   reply, act, serve, provide, support, supply, deliver, set, assign, name.
# "Set", "assign", and "name" count only with the objects of authority below.

[verb.face]
suggest = ["have", "is subject to"]
[verb.treat]
needs = "normative"
suggest = ["count as", "handle as"]
[verb.assume]
needs = "propositional"
severity = "info"
suggest = ["is valid only if", "requires"]
[verb.respect]
suggest = ["stay within", "satisfy"]
[verb.contribute]
suggest = ["provide", "supply"]
[verb.trade]
suggest = ["exchange", "weigh"]

# Acts of authority. "Set", "assign", and "name" are literal for any subject in
# their senses "determine" and "denote" ("physics sets the latency", "a label
# names the seal"), so only their objects of authority are restricted: "a job
# sets the hours", "a job assigns the problems", "a job names the role".
[[phrase]]
verb = "set"
object = ["hour", "schedule", "agenda", "goal", "standard", "expectation", "priority", "deadline", "wage", "salary", "price", "quota", "task", "role"]
needs = "concrete"
suggest = ["determine", "is set by (passive)"]

[[phrase]]
verb = "assign"
object = ["problem", "task", "work", "role", "duty", "homework", "responsibility", "blame", "grade"]
needs = "concrete"
suggest = ["determine", "is assigned by (passive)"]

[[phrase]]
verb = "name"
object = ["role", "title", "successor", "heir", "winner", "leader"]
needs = "concrete"
suggest = ["determine", "is named by (passive)"]

[verb.reward]
needs = "concrete"
suggest = ["benefit", "is rewarded by (passive)"]
[verb.punish]
needs = "concrete"
suggest = ["harm", "is punished by (passive)"]
[verb.grant]
needs = ["concrete", "normative"]
suggest = ["allow", "is granted by (passive)"]
[verb.award]
needs = "concrete"
[verb.hire]
[verb.appoint]
# Procedures, maps, and blueprints guide as well as people do.
[verb.guide]
needs = ["concrete", "text", "idea"]
severity = "info"
suggest = ["determine", "constrain"]
[verb.offer]
needs = "concrete"
severity = "info"
suggest = ["include", "contain", "make available"]

# Lexicalized idioms that do not carry their verb's literal restriction.
[[phrase]]
verb = "stand"
prep = "for"
needs = "any"

# "Contribute to" is causal: "contention contributes to latency".
[[phrase]]
verb = "contribute"
prep = "to"
needs = "any"

[[phrase]]
verb = "agree"
prep = "to"
suggest = ["accept"]
