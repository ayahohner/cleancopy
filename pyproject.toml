[project]
name = "cleancopy"
version = "0.4.1"
description = "Deterministic checks for English prose, aimed at the habits of LLM-written text."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "nltk>=3.9",
    "preshed>=3.0.13,<3.0.14",  # 3.0.14 breaks spaCy's tokenizer; uvx ignores uv.lock
    "spacy>=3.8,<3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
cleancopy = "cleancopy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleancopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning:torch"]

[tool.hatch.metadata]
allow-direct-references = true  # the spaCy model is not on PyPI
